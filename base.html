<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Қаржы</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/flatpickr"></script><script src="https://npmcdn.com/flatpickr/dist/l10n/kz.js"></script><script>if(localStorage.getItem('darkMode') === 'true') { document.documentElement.classList.add('dark-mode'); }</script></head><body class="pb-5">
<script>
    function applyTheme() { if(localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark-mode'); } else { document.body.classList.remove('dark-mode'); } }
    applyTheme();
</script>
{% block content %}{% endblock %}
{% if session.get('user_id') %}
<div class="offcanvas offcanvas-start shadow-lg" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header bg-primary text-white">
        <h5 class="offcanvas-title fw-bold"><i class="fa-solid fa-wallet me-2"></i>Мәзір</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="px-4 py-3 bg-light border-bottom">
        <label class="fw-bold small text-muted mb-2">Ағымдағы шот:</label>
        <form action="/set_account" method="POST" id="accForm">
            <select name="account_id" class="form-select fw-bold border-0 shadow-sm" onchange="document.getElementById('accForm').submit()">
                <option value="all" {% if active_account == 'all' %}selected{% endif %}>Барлық шоттар</option>
                {% for acc in user_accounts %}
                <option value="{{ acc.id }}" {% if active_account == acc.id|string %}selected{% endif %}>{{ acc.name }}</option>
                {% endfor %}
            </select>
        </form>
    </div>
    <div class="offcanvas-body p-0 d-flex flex-column">
        <div class="list-group list-group-flush mt-2 flex-grow-1">
            <a href="#" class="list-group-item list-group-item-action border-0 py-3 fw-bold" data-bs-toggle="modal" data-bs-target="#addModal" onclick="loadCategories('expense')"><i class="fa-solid fa-plus me-3 text-success fs-5"></i>Жаңа жазба</a>
            <a href="/" class="list-group-item list-group-item-action border-0 py-3 fw-medium"><i class="fa-solid fa-list me-3 text-primary fs-5"></i>Менің жазбаларым</a>
            <a href="/analytics" class="list-group-item list-group-item-action border-0 py-3 fw-medium"><i class="fa-solid fa-chart-pie me-3 text-info fs-5"></i>Аналитика және Экспорт</a>
            <a href="/settings" class="list-group-item list-group-item-action border-0 py-3 fw-medium"><i class="fa-solid fa-gear me-3 text-secondary fs-5"></i>Санаттар баптауы</a>
            <a href="/logout" class="list-group-item list-group-item-action border-0 py-3 text-danger mt-auto fw-medium border-top"><i class="fa-solid fa-right-from-bracket me-3 fs-5"></i>Шығу</a>
        </div>
        <div class="mt-auto border-top py-4 px-4 bg-light">
            <div class="form-check form-switch d-flex align-items-center">
                <input class="form-check-input me-3" type="checkbox" id="darkModeSwitch" onchange="toggleDarkMode()" style="width: 40px; height: 20px;">
                <label class="form-check-label text-dark fw-bold fs-6" for="darkModeSwitch"><i class="fa-solid fa-moon me-2 text-primary"></i>Түнгі режим</label>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow-lg"><div class="modal-header bg-primary text-white border-0 rounded-top-4"><h5 class="modal-title fw-bold">Жаңа жазба</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><form action="/add" method="POST"><div class="modal-body p-4"><div class="btn-group w-100 mb-4"><input type="radio" class="btn-check" name="type" id="typeExpense" value="expense" checked onchange="loadCategories('expense')"><label class="btn btn-outline-danger fw-bold py-2" for="typeExpense">Шығыс</label><input type="radio" class="btn-check" name="type" id="typeIncome" value="income" onchange="loadCategories('income')"><label class="btn btn-outline-success fw-bold py-2" for="typeIncome">Кіріс</label></div>
    <label class="form-label small text-muted fw-bold">Шот</label><select name="account_id" class="form-select mb-3 bg-light border-0 shadow-sm" required>{% for acc in user_accounts %}<option value="{{ acc.id }}" {% if active_account == acc.id|string %}selected{% endif %}>{{ acc.name }}</option>{% endfor %}</select>
    <label class="form-label small text-muted fw-bold">Санат</label><select name="category" id="categorySelect" class="form-select mb-3 bg-light border-0 shadow-sm" required><option value="">Жүктелуде...</option></select><label class="form-label small text-muted fw-bold">Сома</label><input type="number" step="0.01" name="amount" class="form-control mb-3 bg-light border-0 shadow-sm" required><label class="form-label small text-muted fw-bold">Күні</label><input type="date" name="date" class="form-control mb-3 bg-light border-0 shadow-sm custom-datepicker" id="currentDateInput"></div><div class="modal-footer border-0 p-3 pt-0"><button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm rounded-3">Сақтау</button></div></form></div></div></div>
<script>
document.getElementById('currentDateInput').value = new Date().toISOString().split('T')[0];
function loadCategories(type) { const select = document.getElementById('categorySelect'); select.innerHTML = '<option value="">Жүктелуде...</option>'; fetch(`/api/categories?type=${type}`).then(res => res.json()).then(data => { select.innerHTML = data.length ? '' : '<option value="">Санаттар жоқ</option>'; data.forEach(cat => select.innerHTML += `<option value="${cat}">${cat}</option>`); }); }

document.addEventListener('DOMContentLoaded', function() {
    flatpickr('.custom-datepicker', { locale: "kz", dateFormat: "Y-m-d", disableMobile: "true" });
    const toggle = document.getElementById('darkModeSwitch');
    if(toggle) toggle.checked = localStorage.getItem('darkMode') === 'true';
});

function toggleDarkMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', isDark);
}
</script>
{% endif %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const requiredElements = document.querySelectorAll('input[required], select[required]');
    requiredElements.forEach(el => {
        el.addEventListener('invalid', function() { if (this.validity.valueMissing) { this.setCustomValidity('Бұл өрісті толтырыңыз'); } });
        el.addEventListener('input', function() { this.setCustomValidity(''); });
        el.addEventListener('change', function() { this.setCustomValidity(''); });
    });
});
</script>
{% block scripts %}{% endblock %}
</body></html>
